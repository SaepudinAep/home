<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Generator — Teaching Tools Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body { font-family: 'Roboto', sans-serif; margin: 0; background: #f5f5f5; color: #333; }

  /* ── Header ─────────────────────────────────── */
  header {
    background: linear-gradient(135deg, #4d97ff 0%, #00c896 100%);
    color: #fff; padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-family: 'Fredoka One', cursive; font-size: 24px; margin: 0; }
  header nav a {
    background: #ffab19; color: #fff; text-decoration: none;
    padding: 8px 14px; border-radius: 6px; font-weight: bold;
  }
  header nav a:hover { background: #4d97ff; }

  /* ── Form / Controls ────────────────────────── */
  .controls {
    max-width: 800px; margin: 24px auto; padding: 24px;
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  .controls h3 { margin: 0 0 16px; font-family: 'Fredoka One', cursive; color: #4d97ff; }
  .controls label { margin-right: 18px; cursor: pointer; font-size: 14px; }
  .controls input[type="radio"] { margin-right: 4px; }

  .field-group { margin-top: 14px; }
  .field-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #555; }
  .field-group input[type="text"],
  .field-group select {
    padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; width: 260px;
  }

  .btn-row { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 10px 22px; border: none; border-radius: 6px;
    font-weight: bold; font-size: 14px; cursor: pointer;
    color: #fff; transition: background .2s;
  }
  .btn-generate { background: #4d97ff; }
  .btn-generate:hover { background: #357ae8; }
  .btn-print { background: #00c896; }
  .btn-print:hover { background: #00a87d; }

  /* ── A4 Page ────────────────────────────────── */
  .page {
    width: 210mm; min-height: 297mm; max-height: 297mm;
    margin: 20px auto; padding: 8mm 10mm;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
    display: flex; flex-direction: row;
    gap: 6mm;
    overflow: hidden;
  }
  .column {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 4mm;
  }

  /* ── Tables ─────────────────────────────────── */
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    border: 1px solid #444;
    text-align: center;
    font-size: 10px;
    padding: 2px 3px;
    overflow: hidden;
    white-space: nowrap;
  }
  th {
    font-weight: bold;
    font-size: 10px;
    padding: 3px 3px;
  }
  td { height: 22px; }

  /* Caption = nama siswa di atas tabel */
  .student-name {
    font-family: 'Fredoka One', cursive;
    font-size: 11px;
    margin: 0 0 1px;
    text-align: left;
    letter-spacing: .3px;
  }

  /* Warna header tabel per siswa */
  .t1  th { background: #4d97ff; color: #fff; }
  .t2  th { background: #ffab19; color: #fff; }
  .t3  th { background: #00bcd4; color: #fff; }
  .t4  th { background: #e91e63; color: #fff; }
  .t5  th { background: #9c27b0; color: #fff; }
  .t6  th { background: #4caf50; color: #fff; }
  .t7  th { background: #f44336; color: #fff; }
  .t8  th { background: #607d8b; color: #fff; }
  .t9  th { background: #009688; color: #fff; }
  .t10 th { background: #ff5722; color: #fff; }

  /* ── Print ──────────────────────────────────── */
  @media print {
    html, body { margin: 0; padding: 0; background: #fff; }
    header, .controls, .btn-row, .no-print { display: none !important; }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    .page {
      width: 210mm; height: 297mm;
      min-height: 297mm; max-height: 297mm;
      margin: 0; padding: 8mm 10mm;
      box-shadow: none;
      page-break-after: always;
      page-break-inside: avoid;
    }

    th {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    a[href]::after { content: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 Absensi Generator</h1>
  <nav><a href="index.html">Home</a></nav>
</header>

<div class="controls">
  <h3>Pengaturan Absensi</h3>

  <div style="margin-bottom:10px;">
    <strong style="font-size:13px;color:#555;">Jenis Tabel:</strong><br>
    <label><input type="radio" name="jenis" value="sekolah" checked> Sekolah</label>
    <label><input type="radio" name="jenis" value="privat"> Privat (Kehadiran)</label>
    <label><input type="radio" name="jenis" value="materi"> Privat (Materi)</label>
    <label><input type="radio" name="jenis" value="terapi"> Terapi Wicara</label>
  </div>

  <div class="field-group">
    <label for="bulan">Bulan / Periode:</label>
    <input type="text" id="bulan" placeholder="cth: Oktober 2026">
  </div>

  <div class="field-group">
    <label for="jumlahBaris">Jumlah Baris per Tabel:</label>
    <select id="jumlahBaris">
      <option value="4">4 baris</option>
      <option value="5">5 baris</option>
      <option value="6">6 baris</option>
      <option value="7">7 baris</option>
      <option value="8" selected>8 baris</option>
      <option value="9">9 baris</option>
      <option value="10">10 baris</option>
    </select>
  </div>

  <div class="field-group">
    <label>Nama (10 nama, pisahkan dengan koma):</label>
    <input type="text" id="namaSiswa" style="width:100%"
      placeholder="cth: Ahmad, Budi, Citra, Dina, Eka, Fajar, Gita, Hana, Irfan, Joko">
  </div>

  <div class="btn-row">
    <button class="btn btn-generate" onclick="generateAbsensi()">📄 Generate Absensi</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Cetak / Print</button>
  </div>
</div>

<div id="absensiContainer"></div>

<script>
function getHeaders(jenis) {
  switch (jenis) {
    case 'sekolah':
      return `<tr>
        <th style="width:8%">No</th>
        <th style="width:30%">Tanggal</th>
        <th style="width:40%">Materi</th>
        <th style="width:22%">Sekolah</th>
      </tr>`;
    case 'privat':
      return `<tr>
        <th style="width:8%">No</th>
        <th style="width:39%">Tanggal</th>
        <th style="width:28%">Nama</th>
        <th style="width:25%">Paraf</th>
      </tr>`;
    case 'materi':
      return `<tr>
        <th style="width:8%">No</th>
        <th style="width:22%">Tanggal</th>
        <th style="width:25%">Activity</th>
        <th style="width:45%">Materi</th>
      </tr>`;
    case 'terapi':
      return `<tr>
        <th style="width:10%">No</th>
        <th style="width:55%">Tanggal</th>
        <th style="width:35%">Paraf</th>
      </tr>`;
  }
}

function getColCount(jenis) {
  return jenis === 'terapi' ? 3 : 4;
}

function buatTabel(jenis, colorClass, label, rows) {
  const cols = getColCount(jenis);
  let html = '';

  if (label) {
    html += `<p class="student-name">${label}</p>`;
  }

  html += `<table class="${colorClass}">`;
  html += getHeaders(jenis);

  for (let i = 1; i <= rows; i++) {
    html += '<tr>';
    html += `<td>${i}</td>`;
    for (let c = 1; c < cols; c++) {
      html += '<td></td>';
    }
    html += '</tr>';
  }
  html += '</table>';
  return html;
}

function generateAbsensi() {
  const jenis = document.querySelector('input[name="jenis"]:checked').value;
  const bulan = document.getElementById('bulan').value.trim();
  const rows  = parseInt(document.getElementById('jumlahBaris').value, 10);

  // Parse nama siswa
  const namaRaw = document.getElementById('namaSiswa').value.trim();
  let names = [];
  if (namaRaw) {
    names = namaRaw.split(',').map(n => n.trim()).filter(n => n);
  }

  const container = document.getElementById('absensiContainer');
  container.innerHTML = '';

  const page = document.createElement('div');
  page.className = 'page';

  const colLeft  = document.createElement('div'); colLeft.className  = 'column';
  const colRight = document.createElement('div'); colRight.className = 'column';

  // Tambah judul bulan jika diisi
  if (bulan) {
    colLeft.innerHTML  += `<p style="margin:0;font-family:'Fredoka One',cursive;font-size:12px;text-align:center;color:#4d97ff;">📋 Absensi — ${bulan}</p>`;
    colRight.innerHTML += `<p style="margin:0;font-family:'Fredoka One',cursive;font-size:12px;text-align:center;color:#4d97ff;">📋 Absensi — ${bulan}</p>`;
  }

  for (let i = 1; i <= 10; i++) {
    const label = names[i - 1] ? names[i - 1] : '';
    const tableHTML = buatTabel(jenis, 't' + i, label, rows);
    if (i <= 5) {
      colLeft.innerHTML += tableHTML;
    } else {
      colRight.innerHTML += tableHTML;
    }
  }

  page.appendChild(colLeft);
  page.appendChild(colRight);
  container.appendChild(page);
}

// Auto-generate saat pertama buka
document.addEventListener('DOMContentLoaded', generateAbsensi);
</script>

</body>
</html>
