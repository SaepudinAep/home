<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Math Worksheet Generator (Versi Baru)</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#4d97ff; --green:#00c896; --orange:#ffab19; --yellow:#fff3d6; --text:#333;
    }
    body { font-family:'Roboto',sans-serif; margin:0; background:#fdfdfd; color:var(--text); }
    header {
      background: linear-gradient(90deg,var(--blue),var(--green));
      color:white; padding:20px; display:flex; justify-content:space-between; align-items:center;
    }
    header h1 { font-family:'Fredoka One',cursive; font-size:28px; margin:0; }
    header nav a {
      background:var(--orange); color:#fff; text-decoration:none; padding:8px 16px;
      border-radius:6px; font-weight:bold; transition:background 0.2s;
    }
    header nav a:hover { background:var(--blue); }

    form {
      background:var(--orange); padding:20px; border-radius:10px; margin:20px;
    }
    form h3 { margin:10px 0 8px; font-family:'Fredoka One'; color:var(--blue); }
    form .row { display:flex; gap:12px; flex-wrap:wrap; }
    form input[type="number"] { padding:6px 8px; border:2px solid var(--blue); border-radius:6px; width:120px; }
    form label { margin-right:12px; }
    button {
      background:var(--blue); color:white; border:none; padding:10px 20px; border-radius:6px;
      cursor:pointer; font-weight:bold; margin-top:15px; margin-right:10px;
    }
    button:hover { background:var(--green); }

    .page {
      height:267mm; display:flex; flex-direction:column; margin:20px; background:#fff;
      border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }
    .page-header { flex:0 0 30mm; text-align:center; padding:10px 12px; border-bottom:3px solid var(--green); }
    .page-header h2 { font-family:'Fredoka One'; color:var(--blue); margin:6px 0 4px; }
    .page-header .subjudul { font-size:14px; color:#555; }
    .page-content { flex:1; display:flex; padding:16px; }
    .worksheet {
      flex:1; display:grid; grid-template-columns:0.6fr 2fr 2fr 0.6fr 2fr 2fr; column-gap:12px; row-gap:12px;
    }
    .cell { padding:6px 8px; font-size:16px; background:#fff; border-radius:6px; box-sizing:border-box; }
    .nomor { font-weight:700; color:var(--green); text-align:right; display:flex; align-items:center; justify-content:flex-end; }
    .soal { color:var(--blue); display:flex; align-items:center; }
    .soal .vstack { line-height:1.4; }
    .coretan { border:1px solid var(--orange); background:var(--yellow); }
    footer { background:var(--yellow); text-align:center; padding:15px; font-size:14px; color:var(--text); }

    @media print {
      form, header, footer { display:none; }
      body{margin:0;} @page{ size:A4; margin:15mm; }
      .page { margin:0; box-shadow:none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Math Worksheet Generator (Versi Baru)</h1>
    <nav><a href="index.html">Home</a></nav>
  </header>

  <form>
    <h3>Jumlah soal</h3>
    <input type="number" id="jumlah" value="20">

    <h3>Soal per halaman</h3>
    <input type="number" id="perHalaman" value="20">

    <h3>Pilih operasi</h3>
    <label><input type="checkbox" name="opsi" value="add" checked> Penjumlahan</label>
    <label><input type="checkbox" name="opsi" value="sub" checked> Pengurangan</label>
    <label><input type="checkbox" name="opsi" value="mul" checked> Perkalian</label>
    <label><input type="checkbox" name="opsi" value="div" checked> Pembagian</label>

    <h3>Format soal</h3>
    <label><input type="radio" name="format" value="horizontal" checked> Horizontal</label>
    <label><input type="radio" name="format" value="vertical"> Vertikal</label>
    <label><input type="radio" name="format" value="mix"> Campuran</label>

    <h3>Range penjumlahan & pengurangan</h3>
    <div class="row">
      <label>Min <input type="number" id="addsubMin" value="10"></label>
      <label>Max <input type="number" id="addsubMax" value="99"></label>
    </div>

    <h3>Range perkalian</h3>
    <div class="row">
      <label>Min <input type="number" id="mulMin" value="1"></label>
      <label>Max <input type="number" id="mulMax" value="9"></label>
    </div>

    <h3>Pembagian</h3>
    <div class="row">
      <label>Dividend maksimal <input type="number" id="dividendMax" value="100"></label>
    </div>

    <button type="button" onclick="generateWorksheet()">Generate Worksheet</button>
    <button type="button" onclick="window.print()">Cetak</button>
    <button type="button" onclick="document.getElementById('worksheetContainer').innerHTML=''">Reset</button>
  </form>

  <div id="worksheetContainer"></div>

  <footer>© 2026 Math Worksheet Generator • Versi Baru</footer>
  
  <script>
    function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

    function generateWorksheet(){
      const jumlah = parseInt(document.getElementById('jumlah').value, 10) || 20;
      const perHalaman = parseInt(document.getElementById('perHalaman').value, 10) || 20;
      const opsis = Array.from(document.querySelectorAll('input[name="opsi"]:checked')).map(el=>el.value);
      const format = document.querySelector('input[name="format"]:checked').value;
      const addsubMin = parseInt(document.getElementById('addsubMin').value, 10);
      const addsubMax = parseInt(document.getElementById('addsubMax').value, 10);
      const mulMin = parseInt(document.getElementById('mulMin').value, 10);
      const mulMax = parseInt(document.getElementById('mulMax').value, 10);
      const dividendMax = parseInt(document.getElementById('dividendMax').value, 10);

      const container = document.getElementById('worksheetContainer');
      container.innerHTML = "";

      if (opsis.length === 0){
        container.innerHTML = "<p style='color:red;'>Silakan pilih minimal satu operasi.</p>";
        return;
      }

      // Bangun kumpulan soal
      const semuaSoal = [];
      for (let i=0; i<jumlah; i++){
        const operasi = opsis[Math.floor(Math.random()*opsis.length)];
        let a, b, simbol;

        if (operasi === "add"){ 
          a = rand(addsubMin, addsubMax); 
          b = rand(addsubMin, addsubMax); 
          simbol = "+"; 
        }
        else if (operasi === "sub"){ 
          a = rand(addsubMin, addsubMax); 
          b = rand(addsubMin, addsubMax); 
          simbol = "−"; 
        }
        else if (operasi === "mul"){ 
          a = rand(mulMin, mulMax); 
          b = rand(mulMin, mulMax); 
          simbol = "×"; 
        }
        else { // div → patokan dividend
          a = rand(2, dividendMax);   // dividend acak
          b = rand(2, 9);             // divisor acak
          a = a - (a % b);            // sesuaikan supaya habis dibagi
          simbol = "÷";
        }

        const paksaHorizontal = (operasi === "div");
        let teks;
        if (paksaHorizontal || format === "horizontal" || (format === "mix" && Math.random() > 0.5)){
          teks = `${a} ${simbol} ${b} = .....`;
        } else {
          teks = `<span class="vstack">${a}<br>${simbol} ${b}<br>_____<br>.....</span>`;
        }
        semuaSoal.push({ nomor: i+1, teks });
      }

      // Pagination sesuai input perHalaman
      const totalHalaman = Math.ceil(jumlah / perHalaman);
      const headerHeightMM = 20;        // sesuai CSS .page-header
      const pageHeightMM = 290;         // tinggi konten dalam margin
      const rowGapMM = 8;              // sesuai CSS .worksheet row-gap

      for (let h=0; h<totalHalaman; h++){
        const halamanSoal = semuaSoal.slice(h*perHalaman, (h+1)*perHalaman);

        // Bagi menjadi dua kolom soal (kiri-kanan)
        const half = Math.ceil(halamanSoal.length / 2);
        const soalA = halamanSoal.slice(0, half);
        const soalB = halamanSoal.slice(half);

        const rows = Math.max(soalA.length, soalB.length);
        const contentHeightMM = pageHeightMM - headerHeightMM;
        const rowHeightMM = (contentHeightMM - (rows - 1) * rowGapMM) / rows;

        // Page wrapper
        const pageEl = document.createElement('div');
        pageEl.className = 'page';

        // Header per halaman
        const headerEl = document.createElement('div');
        headerEl.className = 'page-header';
        headerEl.innerHTML = `
          <h2>Lembar Latihan</h2>
          <div class="subjudul">Nama: ____________________ &nbsp;&nbsp;&nbsp; Tanggal: ____________________</div>
        `;
        pageEl.appendChild(headerEl);

        // Grid soal
        const contentEl = document.createElement('div');
        contentEl.className = 'page-content';

        const gridEl = document.createElement('div');
        gridEl.className = 'worksheet';
        gridEl.style.gridAutoRows = rowHeightMM + 'mm';

        for (let i=0; i<rows; i++){
          const noA = soalA[i]?.nomor ?? "";
          const teksA = soalA[i]?.teks ?? "";
          const noB = soalB[i]?.nomor ?? "";
          const teksB = soalB[i]?.teks ?? "";

          gridEl.innerHTML += `
            <div class="cell nomor">${noA}</div>
            <div class="cell soal">${teksA}</div>
            <div class="cell coretan"></div>
            <div class="cell nomor">${noB}</div>
            <div class="cell soal">${teksB}</div>
            <div class="cell coretan"></div>
          `;
        }

        contentEl.appendChild(gridEl);
        pageEl.appendChild(contentEl);
        container.appendChild(pageEl);
      }
    }
  </script>
</body>
</html>
